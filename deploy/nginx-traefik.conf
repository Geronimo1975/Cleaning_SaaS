# Nginx intern: servește fișierele statice și media, restul merge la Gunicorn.
# Nu leagă porturi pe gazdă și nu face TLS — Traefik e în față.

server {
    listen 80;
    server_name _;

    # DNS-ul intern al Docker. Fără `resolver` + variabilă, nginx rezolvă numele
    # `web` O SINGURĂ DATĂ, la pornire, și păstrează IP-ul: după orice recreare a
    # containerului aplicația devine 502 până la repornirea manuală a proxy-ului.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media publică: avataruri, poze de produs.
    #
    # Documentele de verificare NU sunt aici. Volumul `private_files` nu e
    # montat în acest container, iar singura cale către ele e
    # /cont/documente/<pk>/, care verifică proprietarul în Django.
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        set $upstream_web http://web:8000;
        proxy_pass $upstream_web$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Traefik a terminat TLS; Django trebuie să știe, altfel
        # SECURE_SSL_REDIRECT intră în buclă.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }
}
