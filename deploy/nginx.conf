# Domeniul se înlocuiește la instalare (deploy/README.md).
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name DOMAIN;

    # Provocarea ACME rămâne pe HTTP, restul merge pe TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media publică: avataruri, poze de produs. NIMIC personal.
    #
    # Documentele de verificare (acte de identitate, Führungszeugnis) NU sunt
    # aici: stau în volumul `private_files`, care nu e montat în acest container,
    # și se servesc doar prin /cont/documente/<pk>/, care verifică proprietarul.
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
