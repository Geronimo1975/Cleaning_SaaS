# Varianta pentru serverul care rulează deja Traefik pe 80/443.
#
# Diferența față de `docker-compose.prod.yml`: niciun serviciu nu leagă porturi
# pe gazdă și nu există certbot — Traefik termină TLS și reînnoiește
# certificatele prin resolver-ul `letsencrypt`. Tiparul e cel folosit de
# celelalte aplicații de pe aceeași mașină.
#
# Rețeaua `gethub_gethub-network` există deja; e declarată `external`, deci
# compose nu o creează și nu o șterge.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build: .
    image: cleaning-saas:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      # Documentele de verificare. Volum separat, montat DOAR aici —
      # containerul care servește fișiere statice nu-l vede.
      - private_files:/app/private
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz/')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx-traefik.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - web
    networks:
      - internal
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: gethub_gethub-network

      traefik.http.routers.cleaning-http.rule: Host(`${APP_HOST}`)
      traefik.http.routers.cleaning-http.entrypoints: web
      traefik.http.routers.cleaning-http.middlewares: cleaning-https-redirect

      traefik.http.middlewares.cleaning-https-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.cleaning-https-redirect.redirectscheme.permanent: "true"

      traefik.http.routers.cleaning.rule: Host(`${APP_HOST}`)
      traefik.http.routers.cleaning.entrypoints: websecure
      traefik.http.routers.cleaning.tls: "true"
      traefik.http.routers.cleaning.tls.certresolver: letsencrypt

      traefik.http.services.cleaning.loadbalancer.server.port: "80"

  cron:
    build: .
    image: cleaning-saas:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - private_files:/app/private
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    command: >-
      sh -c 'while :; do
        python manage.py expire_requests || true;
        python manage.py flush_indexing || true;
        sleep 900;
      done'

networks:
  internal:
  traefik:
    external: true
    name: gethub_gethub-network

volumes:
  postgres_data:
  static_files:
  media_files:
  private_files:
