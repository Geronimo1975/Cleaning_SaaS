{% load static %}<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ProFM{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/profm.css' %}">
</head>
<body>
  <header class="public-top">
    <a class="brand" href="{% if marketing_site_url %}{{ marketing_site_url }}{% else %}/jobs/{% endif %}">
      <span class="brand-mark">PF</span> ProFM
    </a>
  </header>
  {% if messages %}
  <ul class="messages">
    {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
  </ul>
  {% endif %}
  <main class="public">{% block content %}{% endblock %}</main>
</body>
</html>
