name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres e implicitul proiectului din bcd00a0. Un test verde pe SQLite nu
    # spune nimic despre constrângeri deferabile, tipuri JSON sau tranzacții.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cleaning_test
          POSTGRES_USER: cleaning
          POSTGRES_PASSWORD: cleaning
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://cleaning:cleaning@localhost:5432/cleaning_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalează dependențele
        run: |
          python -m pip install --upgrade pip
          pip install "django>=5.2,<6.0" "django-allauth>=65.0" "django-htmx>=1.19" \
                      "python-dotenv>=1.0" "pillow>=10.4" "openpyxl>=3.1" \
                      "dj-database-url>=2.2" "psycopg[binary]>=3.2" \
                      pytest pytest-django
      - name: Verificări Django
        run: python manage.py check
      - name: Verificări de producție
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DEBUG: "0"
          SECRET_KEY: ${{ github.sha }}${{ github.sha }}
          ALLOWED_HOSTS: example.de
      - name: Migrări fără modificări nesalvate
        run: python manage.py makemigrations --check --dry-run
      - name: Teste
        run: python -m pytest -q --create-db

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construiește imaginea
        run: docker build -t cleaning-saas:${{ github.sha }} .
