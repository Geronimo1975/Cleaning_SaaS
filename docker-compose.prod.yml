services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Fără `ports:` — baza nu se expune pe internet.

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      # Documentele de verificare, în volum propriu. Nginx nu-l vede.
      - private_files:/app/private
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz/')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >-
      sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'

  # Comenzile programate: expirarea cererilor și coada de indexare Google.
  # Nu există Celery în proiect — nimic nu are nevoie de o coadă de task-uri.
  cron:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - private_files:/app/private
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c 'while :; do
        python manage.py expire_requests;
        python manage.py flush_indexing;
        sleep 900;
      done'

volumes:
  postgres_data:
  static_files:
  media_files:
  private_files:
  certbot_conf:
  certbot_www:
